# Candidate data universe. Availability is verified empirically by `riskcausal verify-data`
# (results in DATASET_MANIFEST.md) — nothing here is assumed to exist.
etfs:
  SPY:  {name: S&P 500, group: us_equity}
  QQQ:  {name: Nasdaq 100, group: us_equity}
  IWM:  {name: Russell 2000, group: us_equity}
  EFA:  {name: MSCI EAFE, group: intl_equity}
  EEM:  {name: MSCI Emerging Markets, group: intl_equity}
  XLF:  {name: Financials, group: sector}
  XLK:  {name: Technology, group: sector}
  XLE:  {name: Energy, group: sector}
  XLV:  {name: Health Care, group: sector}
  XLI:  {name: Industrials, group: sector}
  XLY:  {name: Consumer Discretionary, group: sector}
  XLP:  {name: Consumer Staples, group: sector}
  XLU:  {name: Utilities, group: sector}
  XLB:  {name: Materials, group: sector}
  KRE:  {name: Regional Banks, group: sector}
  SHY:  {name: 1-3y Treasury, group: treasury}
  IEF:  {name: 7-10y Treasury, group: treasury}
  TLT:  {name: 20+y Treasury, group: treasury}
  TIP:  {name: TIPS, group: treasury}
  LQD:  {name: IG Corporate, group: credit}
  HYG:  {name: High Yield Corporate, group: credit}
  GLD:  {name: Gold, group: commodity}
  DBC:  {name: Commodity Index, group: commodity}
  USO:  {name: Crude Oil, group: commodity}
  UUP:  {name: US Dollar Index, group: fx}

fred:
  # availability (non-revised daily series, LEAKAGE_AUDIT row 2):
  #   market_close: value is public market data at the close of its date (CBOE VIX, Treasury yields); usable
  #                 `macro_release_lag_bdays` (=1) sessions later, as in M2.
  #   release:      vendor data that reaches the public through FRED with delays (Moody's, ICE BofA); usable the
  #                 session after FRED's ALFRED first-release date (fallback lag where untracked).
  VIXCLS:        {name: CBOE VIX close, freq: D, revised: false, availability: market_close}
  BAA10Y:        {name: Moody's Baa minus 10y Treasury, freq: D, revised: false, availability: release}
  AAA10Y:        {name: Moody's Aaa minus 10y Treasury, freq: D, revised: false, availability: release}
  BAMLH0A0HYM2:  {name: ICE BofA US HY OAS, freq: D, revised: false, availability: release}
  T10Y2Y:        {name: 10y minus 2y Treasury, freq: D, revised: false, availability: market_close}
  T10Y3M:        {name: 10y minus 3m Treasury, freq: D, revised: false, availability: market_close}
  DGS10:         {name: 10y Treasury yield, freq: D, revised: false, availability: market_close}
  NFCI:          {name: Chicago Fed NFCI, freq: W, revised: true}
  UNRATE:        {name: Unemployment rate, freq: M, revised: true}
  STLFSI4:       {name: St. Louis Fed Financial Stress Index, freq: W, revised: true}
